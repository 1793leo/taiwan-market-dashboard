name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas lxml html5lib beautifulsoup4
      - run: |
          cd scripts && python3 etf.py
          python3 - <<'PY'
          import re, requests, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36","Origin":"https://www.cathaysite.com.tw","Referer":"https://www.cathaysite.com.tw/"}
          r=requests.get("https://cwapi.cathaysite.com.tw/api/ETF/GetETFDetailFutureList",params={"FundCode":"CN","SearchDate":"2026-11-16"},headers=UA,timeout=30); print("CFUT", r.text[:600])
          t=requests.get("https://websys.fsit.com.tw/FubonETF/Fund/Assets.aspx?stkId=006208",headers=UA,timeout=30).text
          t=re.sub(r"<[^>]+>"," ",t); t=re.sub(r"\s+"," ",t)
          for m in re.finditer(r"\d{3,4}/\d{1,2}/\d{1,2}", t): print("FDATE", t[max(0,m.start()-80):m.end()+20])
          PY
