name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import requests
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36", "Origin": "https://www.cathaysite.com.tw", "Referer": "https://www.cathaysite.com.tw/"}
          for ep in ("BuySale/GetStocksList", "BuySale/GetFuturesList"):
              for p in ({"FundCode": "DO"}, {"FundCode": "DO", "SearchDate": "2026-11-18"}):
                  r = requests.get("https://cwapi.cathaysite.com.tw/api/" + ep, params=p, headers=H, timeout=30)
                  print("CB", ep, p, r.status_code, r.text[:900])
          PY
