name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import requests, warnings
          warnings.filterwarnings("ignore")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36", "Accept": "application/json"}
          for fid in ("00515073", "00580854", "00580860", "00648622", "00719554", "88329556"):
              for d in ("", "2026/11/18"):
                  r = requests.get("https://www.uobam.com.tw/json/reply/WebSitePcfRequest", params={"fundID": fid, "pcfDate": d}, headers=H, timeout=30, verify=False)
                  print("UPCF", fid, repr(d), r.status_code, r.text[:1800].replace("\n", " "))
          PY
