name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pandas
      - run: |
          cd scripts && python3 trust.py && python3 -c "
          import trust; from pathlib import Path
          trust.update(Path('../out'))"
          cd .. && cat out/trust/*.csv | sed 's/^/CSV /' | head -120
