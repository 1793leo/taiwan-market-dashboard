name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas lxml html5lib beautifulsoup4
      - run: |
          cd scripts && python3 -c "
          import etf; from pathlib import Path
          for k in ['0050','0056','00631L']: etf.ETFS.pop(k)
          etf.update(Path('../out'))"
          cd .. && tar czf - out | base64 -w0 | sed 's/^/B64 /'; echo
