name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas lxml
      - run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import etf, json
          from pathlib import Path
          etf.backfill(Path("out"), "2026-10-02", "2026-10-06", ["00981A", "00403A"])
          for p in sorted(Path("out/etf").glob("*/*.json")):
              d = json.loads(p.read_text())
              s = d["summary"]
              print("DOC", p.parent.name, d["date"], "stk", len(d["stocks"]), "fut", len(d["futures"]), "kind", len(d["inkind"]),
                    "sumw", round(sum(x["w"] or 0 for x in d["stocks"]), 1), "nav", s.get("nav"), "os", s.get("osunit"), "diff", s.get("issuesdiff"), "ann", d.get("ann_date"), d["stocks"][:1])
          PY
