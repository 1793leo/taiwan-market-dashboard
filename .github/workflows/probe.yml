name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import json, re, requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9", "Origin": "https://www.cathaysite.com.tw", "Referer": "https://www.cathaysite.com.tw/"}
          h = requests.get("https://www.cathaysite.com.tw/ETF/detail/ECN?tab=etf3", headers=UA, timeout=30).text
          srcs = re.findall(r'src="([^"]+\.js)"', h)
          print("SRCS", srcs)
          for s in srcs:
              b = requests.get("https://www.cathaysite.com.tw/" + s, headers=UA, timeout=60).text
              for k in ("GetETFDetailStockList(", "GetStocksList(", "GetETFDetailFutureList("):
                  for m in list(re.finditer(re.escape(k), b))[:3]:
                      print("CALL", s, k, b[max(0,m.start()-300):m.start()+150].replace("\n"," "))
              # lazy chunks
          rt = [s for s in srcs if "runtime" in s]
          if rt:
              b = requests.get("https://www.cathaysite.com.tw/" + rt[0], headers=UA, timeout=60).text
              print("RT", b[:3000])
          print("##### EZ")
          h = requests.get("https://www.ezmoney.com.tw/ETF/Transaction/PCF?fundCode=49YTW", headers=UA, timeout=30).text
          i = h.find('createApp({')
          print("EZCTX", h[i: i + 5000])
          PY
