name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests, json, warnings
          warnings.filterwarnings("ignore")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          def get(u, **k):
              try: return requests.get(u, headers={**H, **k.pop("h", {})}, timeout=30, **k)
              except Exception as e: print("ERR", u, e); return None
          CH = {"Origin": "https://www.cathaysite.com.tw", "Referer": "https://www.cathaysite.com.tw/"}
          for p in ({"stockCode": "00881"}, {"StockCode": "00881"}, {"code": "00881"}, {"Code": "00881"}):
              r = get("https://cwapi.cathaysite.com.tw/api/ETF/GetETFCode", params=p, h=CH); print("CCODE", p, r.status_code, r.text[:300])
          h = get("https://www.cathaysite.com.tw/ETF/detail/ECN?tab=etf3").text
          js = re.findall(r'src="([^"]*main[^"]*\.js)"', h)[0]
          b = get("https://www.cathaysite.com.tw/" + js).text
          for k in ("GetETFList", "GetETFCode"):
              for m in list(re.finditer(k, b))[:3]: print("CJS", k, b[max(0, m.start()-300): m.start()+300].replace("\n", " "))
          t = get("https://www.fhtrust.com.tw/js/util_footer.js?6aab978e").text
          for k in ("/api/ETFPcf", "/api/stockhold", "/api/assets"):
              for m in list(re.finditer(re.escape(k), t))[:2]: print("FHJS", k, t[max(0, m.start()-500): m.start()+400].replace("\n", " "))
          t = get("https://www.kgifund.com.tw/Fund/RedemptionList?fundNo=J023").text
          i = t.find("function UpdateRedemption"); print("KJS", t[i: i+2500])
          r = get("https://www.uobam.com.tw/fund/etf/pcf", verify=False); t = r.text
          print("UPCF", r.status_code, len(t), sorted(set(re.findall(r'src="([^"]+\.js)"', t)))[:30])
          for m in list(re.finditer("00918", t))[:3]: print("  UHIT", re.sub(r"\s+", " ", t[max(0, m.start()-300): m.start()+200]))
          for s in sorted(set(re.findall(r'src="([^"]+\.js)"', t))):
              u = s if s.startswith("http") else "https://www.uobam.com.tw" + s
              b = get(u, verify=False)
              if b is None: continue
              apis = sorted(set(re.findall(r'["\'`]((?:https?://[^"\'`]*)?/api/[A-Za-z0-9_/\-.]*)', b.text)))
              if apis: print("UJS", s, apis[:80])
          PY
