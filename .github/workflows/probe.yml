name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests, json, warnings, html
          warnings.filterwarnings("ignore")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          def get(u, **k):
              try: return requests.get(u, headers={**H, **k.pop("h", {})}, timeout=30, **k)
              except Exception as e: print("ERR", u, e); return None
          b = get("https://www.fhtrust.com.tw/js/etf_detail.js?20261105101005").text
          print("FHLEN", len(b))
          for k in ("Pcf", "Assets", "assets", "stockhold"):
              for m in list(re.finditer(k, b))[:3]: print("FHD", k, b[max(0, m.start()-500): m.start()+700].replace("\n", " "))
          b = get("https://www.uobam.com.tw/static/js/main.1e36eac5.chunk.js", verify=False).text
          print("UPCFTOK", sorted(set(re.findall(r'[A-Za-z_/.]*[Pp][Cc][Ff][A-Za-z_/]*', b)))[:80])
          print("UHOSTS", sorted(set(re.findall(r'https?://[a-zA-Z0-9.\-]+', b)))[:40])
          i = b.find('"/api/'); 
          print("UAPIS", sorted(set(re.findall(r'["\'](/?api/[^"\']*)', b)))[:80])
          print("UWEB", sorted(set(re.findall(r'["\']([A-Za-z]*/[A-Za-z]+\?fundID=)', b)))[:80])
          for m in list(re.finditer(r"responseStatus", b))[:2]: print("URS", b[max(0, m.start()-1500): m.start()+100].replace("\n", " "))
          PY
