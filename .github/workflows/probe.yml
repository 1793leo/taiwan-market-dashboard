name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 Chrome/130" "https://www.fhtrust.com.tw/js/etf_detail.js?20261105101005" > fh.js
          grep -n -i -E "pcf|getAssets|stockhold|apiRequest|fundID|date" fh.js | head -80 | sed 's/^/FHL /' | cut -c1-260
          curl -sk -A "Mozilla/5.0 Chrome/130" "https://www.uobam.com.tw/static/js/main.1e36eac5.chunk.js" > u.js
          python3 - <<'PY'
          import re
          b = open("u.js").read()
          for k in ("WebSitePcfRequest", "etfpcf", "ETFPCF"):
              for m in list(re.finditer(k, b))[:3]: print("UCTX", k, b[max(0, m.start()-700): m.start()+500].replace("\n", " "))
          PY
