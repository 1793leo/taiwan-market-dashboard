name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests, json, warnings
          warnings.filterwarnings("ignore")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          def get(u, **k):
              try:
                  return requests.get(u, headers={**H, **k.pop("h", {})}, timeout=30, **k)
              except Exception as e: print("ERR", u, e); return None
          r = get("https://cwapi.cathaysite.com.tw/api/ETF/GetETFList", h={"Origin": "https://www.cathaysite.com.tw", "Referer": "https://www.cathaysite.com.tw/"})
          print("CATHAYLIST", r.status_code, r.text[:3000] if r is not None else None)
          for fid in ("504","399","500","501","503","502","378","389","390","365","388","366","069","093","094","095","102","103"):
              try:
                  rr = requests.post("https://www.capitalfund.com.tw/CFWeb/api/etf/buyback", json={"fundId": fid, "date": None}, headers=H, timeout=15)
                  p = (rr.json().get("data") or {}).get("pcf") or {}
                  print("CAP", fid, p.get("fundName"), p.get("date2"))
              except Exception as e: print("CAP", fid, "ERR", e)
          for u in ("https://www.ezmoney.com.tw/ETF/Fund/Info?fundCode=49YTW",):
              t = get(u).text
              for m in re.finditer(r"fundCode=([0-9A-Za-z]+)", t): print("EZ", m.group(1), re.sub(r"<[^>]+>|\s+", " ", t[max(0,m.start()-10): m.end()+150])[:160])
          r = get("https://www.kgifund.com.tw/Home/ETF")
          if r is not None:
              print("KGI", r.status_code, sorted(set(re.findall(r'href="([^"]*(?:Fund|ETF|Etf)[^"]*)"', r.text)))[:80])
              for m in list(re.finditer("009816", r.text))[:4]: print("  KHIT", re.sub(r"\s+", " ", r.text[max(0, m.start()-300): m.start()+200]))
          r = get("https://www.fhtrust.com.tw/ETF/etf_detail/ETF21")
          if r is not None:
              t = r.text
              print("FH", r.status_code, len(t), sorted(set(re.findall(r'(?:url|href|src)\s*[:=]\s*["\']([^"\']*(?:api|Api|API|json|ajax|pcf|PCF|asset|Asset|holding)[^"\']*)', t)))[:60])
              for k in ("申購買回清單", "持股", "fetch(", "axios", "$.ajax", "ETF21"):
                  for m in list(re.finditer(re.escape(k), t))[:2]: print("  FHIT", k, re.sub(r"\s+", " ", t[max(0, m.start()-200): m.start()+300]))
          for u in ("https://www.uobam.com.tw/", "http://www.uobam.com.tw/", "https://uobam.com.tw/"):
              r = get(u, verify=False)
              if r is not None:
                  print("UOB", u, r.status_code, r.url, len(r.text), sorted(set(re.findall(r'href="([^"]*(?:ETF|etf|Fund|fund|PCF|pcf)[^"]*)"', r.text)))[:60])
                  for m in list(re.finditer("00918", r.text))[:3]: print("  UHIT", re.sub(r"\s+", " ", r.text[max(0, m.start()-300): m.start()+200]))
          PY
