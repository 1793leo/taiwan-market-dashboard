name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          h = requests.get("https://www.yuantaetfs.com/tradeInfo/pcf/0050", headers=UA, timeout=60).text
          for s in sorted(set(re.findall(r'src="(/_nuxt/[^"]+\.js)"', h))):
              b = requests.get("https://www.yuantaetfs.com" + s, headers=UA, timeout=60).text
              for k in ("$getAPI=", "getAPI\",", "api/bridge", "APIType", "\"/bridge"):
                  for m in list(re.finditer(re.escape(k), b))[:3]: print("YG", s, k, b[max(0, m.start()-600): m.start()+700].replace("\n", " "))
          PY
