name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas lxml
      - run: |
          python3 - <<'PY'
          import json, re, io, html as H, requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          txt = lambda h: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"<(script|style)[^>]*>.*?</\1>", "", h, flags=re.S)))
          print("##### CAPITAL")
          j = requests.post("https://www.capitalfund.com.tw/CFWeb/api/etf/buyback", json={"fundId": "195", "date": "2026-11-13"}, headers=UA, timeout=30).json()
          print("HIST 11/13", j.get("code"), (j.get("data") or {}).get("pcf", {}).get("date2"), len((j.get("data") or {}).get("stocks") or []))
          j = requests.post("https://www.capitalfund.com.tw/CFWeb/api/etf/buyback", json={"fundId": "195", "date": None}, headers=UA, timeout=30).json()["data"]
          print("STOCK0", json.dumps(j["stocks"][0], ensure_ascii=False)); print("FUT", json.dumps(j["futures"], ensure_ascii=False)[:400]); print("ASSETS", json.dumps(j["assets"], ensure_ascii=False)[:500])
          print("##### FUBON PCF")
          h = requests.get("https://websys.fsit.com.tw/FubonETF/Trade/Pcf.aspx?stkId=006208&lan=TW", headers=UA, timeout=30).text
          t = txt(h); i = t.find("申購"); print(t[t.find("基金淨資產") - 200 if "基金淨資產" in t else 0:][:2500])
          print("##### EZMONEY")
          h = requests.get("https://www.ezmoney.com.tw/ETF/Fund/Info?fundCode=49YTW", headers=UA, timeout=30).text
          m = re.search(r'id="DataAsset" data-content="([^"]*)"', h); a = json.loads(H.unescape(m.group(1)))
          for x in a: print("ASSET", x.get("AssetCode"), x.get("AssetName"), x.get("Value"), "details", len(x.get("Details") or []), json.dumps((x.get("Details") or [None])[0], ensure_ascii=False)[:300])
          for u in ["https://www.ezmoney.com.tw/ETF/Transaction/PCF?fundCode=49YTW", "https://www.ezmoney.com.tw/ETF/Transaction/PCF"]:
              h2 = requests.get(u, headers=UA, timeout=30).text; t = txt(h2)
              print("PCFURL", u, len(h2), "ids", sorted(set(re.findall(r'id="(Data[A-Za-z]+)"', h2))))
              k = t.find("已發行"); print(" TEXT", t[max(0, k - 600):k + 900] if k >= 0 else t[:400])
          print("##### CATHAY")
          h = requests.get("https://www.cathaysite.com.tw/ETF/detail/ECN?tab=etf3", headers=UA, timeout=30).text
          js = re.findall(r'src="([^"]*main[^"]*\.js)"', h); print("JS", js)
          for s in js[:2]:
              b = requests.get("https://www.cathaysite.com.tw/" + s.lstrip("/"), headers=UA, timeout=60).text
              print("LEN", len(b)); print("HOSTS", sorted(set(re.findall(r'https?://[a-zA-Z0-9.-]*cathay[a-zA-Z0-9.-]*', b)))[:20])
              print("ETFAPI", sorted(set(re.findall(r'["\'`]([A-Za-z/]*(?:[Ee][Tt][Ff]|Pcf|PCF|Purchase|Hold|Stock|Portfolio)[A-Za-z/]*)["\'`]', b)))[:120])
          PY
