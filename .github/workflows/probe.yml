name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas lxml
      - run: |
          cd scripts && python3 etf.py 009816 00918 00929 00881 00403A 00713 00685L 00922 00927 00940 00991A 2>&1 | cut -c1-1200
          python3 -c "
          import etf; from pathlib import Path
          for k in list(etf.ETFS):
              if k not in '009816 00918 00929 00881 00403A 00713 00685L 00922 00927 00940 00991A'.split(): etf.ETFS.pop(k)
          etf.update(Path('../out'))"
          cd .. && tar czf - out | base64 -w0 | sed 's/^/B64 /'; echo
