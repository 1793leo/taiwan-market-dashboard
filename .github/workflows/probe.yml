name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests, json, warnings, html
          warnings.filterwarnings("ignore")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          def get(u, **k):
              try: return requests.get(u, headers={**H, **k.pop("h", {})}, timeout=30, **k)
              except Exception as e: print("ERR", u, e); return None
          t = get("https://www.fhtrust.com.tw/ETF/etf_detail/ETF21").text
          print("FHSRC", sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"', t))))
          for s in sorted(set(re.findall(r'src="(/js/[^"]+)"', t))):
              b = get("https://www.fhtrust.com.tw" + s).text
              for k in ("getETFPcf(", "getAssets(", "assetsExcel"):
                  for m in list(re.finditer(re.escape(k), b))[:2]: print("FHC", s, k, b[max(0, m.start()-600): m.start()+500].replace("\n", " "))
          # inline scripts
          for m in re.finditer(r"<script>(.*?)</script>", t, re.S):
              sc = m.group(1)
              if "getETFPcf" in sc or "getAssets" in sc: print("FHINL", sc[:3000].replace("\n", " "))
          b = get("https://www.uobam.com.tw/static/js/main.1e36eac5.chunk.js", verify=False).text
          print("UWS", sorted(set(re.findall(r'WebSite/[A-Za-z0-9_]+', b))))
          for k in ("announce", "datadate"):
              for m in list(re.finditer(k, b))[:2]: print("UJS", k, b[max(0, m.start()-800): m.start()+200].replace("\n", " "))
          r = requests.post("https://www.kgifund.com.tw/Fund/RedemptionVC", data={"fundID": "J023"}, headers=H, timeout=30)
          tt = html.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "|", re.sub(r"<script.*?</script>|<style.*?</style>", " ", r.text, flags=re.S))))
          tt = re.sub(r"(\|\s*)+", "|", tt)
          print("KRED", tt[:600]); print("KTAIL", tt[-2500:])
          PY
