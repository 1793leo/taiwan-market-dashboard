name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import json, re, requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "Accept-Language": "zh-TW,zh;q=0.9"}
          h = requests.get("https://www.cathaysite.com.tw/ETF/detail/ECN?tab=etf3", headers=UA, timeout=30).text
          js = re.findall(r'src="([^"]*main[^"]*\.js)"', h)[0]
          b = requests.get("https://www.cathaysite.com.tw/" + js, headers=UA, timeout=60).text
          for name in ("GetETFDetailStockList", "GetETFDetailFutureList", "GetETFAssets", "BuySale/GetStocksList", "GetLastPCF", "GetETFDetailBuyList", "GetETFInfoMain", "apiUrl", "cwapi"):
              for m in list(re.finditer(re.escape(name), b))[:2]:
                  print("CTX", name, "::", b[max(0, m.start() - 350): m.start() + 250].replace("\n", " "))
          print("PCFNAMES", sorted(set(re.findall(r'api/BuySale/[A-Za-z]+', b))))
          print("##### EZ")
          h = requests.get("https://www.ezmoney.com.tw/ETF/Transaction/PCF?fundCode=49YTW", headers=UA, timeout=30).text
          for m in re.finditer(r'(url\s*:\s*["\'][^"\']+["\']|axios\.[a-z]+\(\s*["\'][^"\']+|\$\.(?:ajax|post|get)\(\s*["\'][^"\']+|fetch\(\s*["\'][^"\']+)', h):
              print("EZURL", h[m.start(): m.start() + 160].replace("\n", " "))
          i = h.find("GetPCF"); print("GETPCF", h[max(0, i - 300): i + 400].replace("\n", " ") if i >= 0 else -1)
          PY
