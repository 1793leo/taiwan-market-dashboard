name: ETF 歷史持股回補

on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始日 YYYY-MM-DD"
        default: "2026-10-01"
      end:
        description: "結束日 YYYY-MM-DD"
        default: "2026-11-16"
      codes:
        description: "ETF 代號（空白分隔，留空 = 全部）"
        default: ""

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 回補
        env:
          TZ: Asia/Taipei
        run: python scripts/etf.py --backfill "${{ github.event.inputs.start }}" "${{ github.event.inputs.end }}" ${{ github.event.inputs.codes }}
      - name: Commit 資料
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: ETF 回補 ${{ github.event.inputs.start }} ~ ${{ github.event.inputs.end }}"
            git pull --rebase -X theirs origin main || true
            git push
          fi
