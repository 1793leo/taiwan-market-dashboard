name: 盤後更新 & 部署

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 產生測試頁
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant"><head><meta charset="utf-8"><title>Hello</title></head>
          <body style="font-family:sans-serif;text-align:center;padding-top:100px">
            <h1>Hello World 👋</h1>
            <p>GitHub Pages 部署成功</p>
            <p id="t"></p>
            <script>document.getElementById('t').textContent='部署時間：' + new Date(document.lastModified).toLocaleString('zh-TW')</script>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
