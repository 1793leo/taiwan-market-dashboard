name: 盤後更新 & 部署

on:
  schedule:
    # GitHub cron 為 UTC：07:40 UTC = 台北 15:40；09:40 UTC = 台北 17:40（補抓）
    - cron: "40 7 * * 1-5"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      years:
        description: "回補年數（第一次執行會自動抓滿）"
        default: "3"
      budget:
        description: "抓取時間上限（分鐘）"
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 對證交所憑證較嚴格可能出現 SSL 錯誤，固定 3.12
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取資料 & 計算市場寬度
        env:
          TZ: Asia/Taipei
        run: |
          python scripts/update.py \
            --years "${{ github.event.inputs.years || '3' }}" \
            --budget "${{ github.event.inputs.budget || '300' }}"

      - name: Commit 資料
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 若抓取失敗仍以現有資料建站
        if: always()
        run: test -f _site/data/dashboard.json || python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
